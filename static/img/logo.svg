<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="hostxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#7C3AED" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background Shape -->
  <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#bgGrad)" stroke="#E2E8F0" stroke-width="2" />
  <!-- VIP White Cloud & Host Hexagon -->
  <g filter="url(#softGlow)">
    <path d="M40 38 L80 38 L95 60 L80 82 L40 82 L25 60 Z" fill="url(#hostxGrad)" opacity="0.12" />
    <!-- Outer Cyber Tech Border -->
    <path d="M42 42 L78 42 L90 60 L78 78 L42 78 L30 60 Z" fill="none" stroke="url(#hostxGrad)" stroke-width="4" stroke-linejoin="round" />
    <!-- Inner Stylized X -->
    <path d="M46 48 L74 72 M74 48 L46 72" stroke="url(#hostxGrad)" stroke-width="5.5" stroke-linecap="round" />
    <!-- Center Dot Pulse -->
    <circle cx="60" cy="60" r="4" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2" />
  </g>
</svg>
